version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore'
      include: scope
    groups:
      angular:
        patterns:
          - '@angular*'
          - '@angular-eslint/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
      stryker:
        patterns:
          - '@stryker-mutator/*'
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # A major Angular bump is a deliberate migration, not a dependency update.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      # Angular 22 requires TypeScript >=6.0 <6.1.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'
    groups:
      codeql:
        patterns:
          - 'github/codeql-action/*'
