<a
  class="ring-chip"
  [style.width.px]="size()"
  [style.height.px]="size()"
  [title]="name()"
  [attr.href]="url() ?? null"
  [attr.target]="url() ? '_blank' : null"
  [attr.aria-label]="name()"
  rel="noopener noreferrer"
>
  @if (assetPath(); as asset) {
    <img
      class="ring-chip-icon"
      [class.ring-chip-icon-invert]="invertIcon()"
      [ngSrc]="asset"
      width="40"
      height="40"
      [alt]="name()"
    />
  } @else if (phIcon(); as ph) {
    <i [class]="'ph ring-chip-ph ' + ph" aria-hidden="true"></i>
  } @else {
    <span class="ring-chip-text">{{ name() }}</span>
  }
</a>
