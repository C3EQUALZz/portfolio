<section id="about" class="section">
  <h6 class="kicker">{{ kicker() }}</h6>

  <div class="highlights">
    @for (highlight of highlights(); track highlight.topic) {
      <div class="highlight">
        <i class="ph {{ highlight.icon }}" aria-hidden="true"></i>
        <p class="highlight-text">{{ highlight.text }}</p>
      </div>
    }
  </div>
</section>
