<header class="header">
  <nav class="header-nav" [attr.aria-label]="sectionsLabel()">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-dot" aria-hidden="true"></span>{{ brand() }}
    </a>
    <span class="spacer"></span>
    <div class="links" id="header-links" [class.links-open]="menuOpen()">
      @for (item of navItems; track item.fragment) {
        <a routerLink="/" [fragment]="item.fragment" (click)="closeMenu()">{{ item.label() }}</a>
      }
      <a routerLink="/certificates" routerLinkActive="link-active" (click)="closeMenu()">
        {{ certificatesLabel() }}
      </a>
      <a routerLink="/stats" routerLinkActive="link-active" (click)="closeMenu()">
        {{ statsLabel() }}
      </a>
    </div>
    <div class="locale-switch" role="group" [attr.aria-label]="languageLabel()">
      @for (lang of locales; track lang) {
        <button
          type="button"
          class="locale-button"
          [class.locale-active]="locale.locale() === lang"
          [attr.aria-pressed]="locale.locale() === lang"
          (click)="locale.setLocale(lang)"
        >
          {{ lang }}
        </button>
      }
    </div>
    <button
      type="button"
      class="theme-toggle"
      [attr.aria-pressed]="theme.theme() === 'light'"
      [attr.aria-label]="themeToggleLabel()"
      (click)="theme.toggle()"
    >
      <i
        class="ph"
        [class.ph-sun]="theme.theme() === 'dark'"
        [class.ph-moon]="theme.theme() === 'light'"
        aria-hidden="true"
      ></i>
    </button>
    <button
      #menuToggle
      type="button"
      class="menu-toggle"
      aria-controls="header-links"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuLabel()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <i class="ph" [class.ph-list]="!menuOpen()" [class.ph-x]="menuOpen()" aria-hidden="true"></i>
      <span>{{ menuLabel() }}</span>
    </button>
  </nav>
</header>
